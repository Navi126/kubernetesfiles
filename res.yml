apiVersion: v1
kind: ReplicationController
metadata:
  name: myrc
  labels:
    app: swiggy
spec:
  replicas: 2
  selector:
      app: swiggy
  template:
    metadata:
      name: mytmp
      labels:
        app: swiggy
    spec:
      containers:
        - name: mycon3
          image: nginx
          ports:
            - containerPort: 81
