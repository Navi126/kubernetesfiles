apiVersion: v1
kind: Pod
metadata:
  name: mypod
  namespace: dev
  labels:
    app: swiggy
spec:
  containers:
    - name: mycon
      image: httpd
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: "20Mi"
          cpu: "10m"
        limits:
          memory: "100Mi"
          cpu: "15m"
      env:
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: my-conf
              key: DB_USER

        - name: DB_USER2
          valueFrom:
            configMapKeyRef:
              name: conf2
              key: DB_USER

      envFrom:
        - secretRef:
            name: mysecret


      volumeMounts:
        - mountPath: /opt/cont1/
          name: devops

    - name: mycont2
      image: httpd
      ports:
        - containerPort: 81
      command: ["/bin/bash", "-c", "while true; do echo Happy; sleep 100; done;"]
      volumeMounts:
        - mountPath: /opt/cont2
          name: devops
      resources:
        requests:
          memory: "10Mi"
          cpu: "10m"
    
        limits:
          memory: "15Mi"
          cpu: "15m"

  volumes:
    - name: devops
      persistentVolumeClaim:
        claimName: mypvc
